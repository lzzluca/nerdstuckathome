<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a453b"/>
    </marker>
  </defs>
  <rect width="760" height="170" fill="#f7f5f0"/>

  <!-- VPS boundary around the last two steps -->
  <rect x="460" y="22" width="292" height="128" rx="10" fill="none" stroke="#b3542c" stroke-dasharray="5 4"/>
  <text x="606" y="142" text-anchor="middle" font-size="12" fill="#b3542c">my VPS</text>

  <g font-size="14" text-anchor="middle">
    <rect x="8" y="40" width="128" height="72" rx="8" fill="#fbfaf7" stroke="#e3ddd0"/>
    <text x="72" y="70" font-weight="600" fill="#1c1a16">Newsletters</text>
    <text x="72" y="92" font-size="12" fill="#6b6558">4 senders</text>

    <rect x="160" y="40" width="128" height="72" rx="8" fill="#fbfaf7" stroke="#e3ddd0"/>
    <text x="224" y="70" font-weight="600" fill="#1c1a16">Main Gmail</text>
    <text x="224" y="92" font-size="12" fill="#6b6558">filter: auto-forward</text>

    <rect x="312" y="40" width="128" height="72" rx="8" fill="#fbfaf7" stroke="#e3ddd0"/>
    <text x="376" y="70" font-weight="600" fill="#1c1a16">Newsletters</text>
    <text x="376" y="86" font-weight="600" fill="#1c1a16">Gmail</text>
    <text x="376" y="104" font-size="12" fill="#6b6558">dedicated inbox</text>

    <rect x="472" y="40" width="128" height="72" rx="8" fill="#fbfaf7" stroke="#e3ddd0"/>
    <text x="536" y="70" font-weight="600" fill="#1c1a16">mail2rss</text>
    <text x="536" y="92" font-size="12" fill="#6b6558">gmail.readonly, no ports</text>

    <rect x="616" y="40" width="128" height="72" rx="8" fill="#fbfaf7" stroke="#e3ddd0"/>
    <text x="680" y="70" font-weight="600" fill="#1c1a16">FreshRSS</text>
    <text x="680" y="92" font-size="12" fill="#6b6558">via Docker network</text>
  </g>

  <g stroke="#4a453b" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="136" y1="76" x2="158" y2="76"/>
    <line x1="288" y1="76" x2="310" y2="76"/>
    <line x1="440" y1="76" x2="470" y2="76"/>
    <line x1="600" y1="76" x2="614" y2="76"/>
  </g>
</svg>
